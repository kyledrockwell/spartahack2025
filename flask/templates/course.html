<!-- templates/course.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ course.code }} - Code Tutor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <nav class="dashboard-nav">
            <div class="nav-header">
                <h2>Code Tutor</h2>
                <p>Welcome, {{ username }}</p>
            </div>
            
            <div class="nav-links">
                <a href="{{ url_for('dashboard_personal') }}" class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                    </svg>
                    Back to Dashboard
                </a>
                
                <div class="nav-divider"></div>
                
                <a href="{{ url_for('settings') }}" class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
                    </svg>
                    Settings
                </a>
            </div>
        </nav>
        
        <!-- Main Content Area -->
        <main class="dashboard-content">
            <div class="course-header">
                <h1>{{ course.code }}: {{ course.title }}</h1>
                <p>{{ course.description }}</p>
            </div>
            
            <div class="assignments-grid">
                {% for assignment in assignments %}
                <div class="assignment-card">
                    <div class="assignment-type">{{ assignment.type | title }}</div>
                    <h3>{{ assignment.title }}</h3>
                    <p>Due: {{ assignment.due_date }}</p>
                    <a href="{{ url_for('assignment_details', course_id=course.code|lower, assignment_id=assignment.id) }}" 
                       class="assignment-btn">Start Assignment</a>
                </div>
                {% endfor %}
            </div>
        </main>
    </div>
</body>
</html>
